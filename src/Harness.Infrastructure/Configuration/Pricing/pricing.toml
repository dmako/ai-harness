# API prices in US dollars per million tokens, used to show an API-equivalent price for the
# tokens agent sessions used (TASK-0114). A subscription plan is not billed per token, so
# these are what the same work would cost through the API, not what was paid.
#
# A model matches its own entry, else the longest entry it starts with. Override or add one in
# .harness/config.toml or the global config:
#
#   [pricing."gpt-6.1-terra"]
#   input = 1.25
#   cached_input = 0.125
#   cache_write = 1.25
#   output = 10.0
#
# Anthropic first-party API rates as of 2026-10-06. cache_write is the 5-minute cache write
# (1.25x input); where a cache read price was not published separately it is 0.1x input.
# Claude Haiku 5.5 is priced at its rate for prompts up to 100K tokens.

