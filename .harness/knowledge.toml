scope = "path:src/Harness.Infrastructure/Processes"
content = "Unix provider processes: a pipe end inherited by another child keeps a client's stdin from reaching EOF (the agent runner's clients read the prompt to end of stdin), which hung every AgentRunnerTests on macOS CI. UnixProviderProcess creates pipes with pipe2(O_CLOEXEC) on Linux and spawns with POSIX_SPAWN_CLOEXEC_DEFAULT on macOS (no pipe2 there), as does DetachedProcess; keep both when touching process start. macOS's /var and /tmp are links to /private/..., so compare a child's reported cwd by physical path."
