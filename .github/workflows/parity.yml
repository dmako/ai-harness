name: Frozen Go parity
on:
  workflow_dispatch:
    inputs:
      go_source_url:
        description: Authorized clone URL for the original Go repository containing the frozen commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/cli-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/packages
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Snapshot and verify original source
        env:
          GO_SOURCE_URL: ${{ inputs.go_source_url }}
        run: |
          python test/Harness.Compatibility/snapshot_source.py --repository "$env:GO_SOURCE_URL" --output artifacts/pinned-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOMODCACHE = Join-Path $PWD artifacts/go-modules
          Push-Location artifacts/pinned-source
          try { go mod download; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }
      - name: Build frozen native drivers
        run: |
          $compiler = (Get-Command go).Source
          python test/Harness.Compatibility/prepare_oracles.py --source artifacts/pinned-source --go "$compiler" --modules artifacts/go-modules --output artifacts/oracles
      - name: Locked restore and complete native suite
        run: |
          dotnet restore Harness.slnx --locked-mode "-bl:artifacts/restore-$([guid]::NewGuid().ToString('N')).binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test/Harness.Compatibility/account_matrix.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test/Harness.Compatibility/regression.py --oracle-map artifacts/oracles/oracle-map.json --output artifacts/parity
      - name: Original export and companion scenarios on Unix
        if: runner.os != 'Windows'
        run: |
          $compiler = (Get-Command go).Source
          python test/Harness.Compatibility/Companions/run_go_scenarios.py --source artifacts/pinned-source --go "$compiler" --modules artifacts/go-modules --output artifacts/companion-go.jsonl
      - name: Measure native self-contained candidate against frozen Go
        run: |
          $rid = python -c "import platform; print(('win' if platform.system() == 'Windows' else 'osx' if platform.system() == 'Darwin' else 'linux') + '-' + ('arm64' if platform.machine().lower() in ('arm64', 'aarch64') else 'x64'))"
          dotnet restore src/Harness.Cli/Harness.Cli.csproj -p:RuntimeIdentifier=$rid -p:PublishProfile=Release --locked-mode "-bl:artifacts/perf-restore-$([guid]::NewGuid().ToString('N')).binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Harness.Cli/Harness.Cli.csproj --no-restore -p:RuntimeIdentifier=$rid -p:PublishProfile=Release -o artifacts/perf-candidate "-bl:artifacts/perf-publish-$([guid]::NewGuid().ToString('N')).binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python benchmarks/performance.py --go "artifacts/oracles/harness$suffix" --candidate "artifacts/perf-candidate/harness$suffix" --output artifacts/performance.json
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ matrix.os }}
          path: |
            artifacts/parity
            artifacts/*summary.json
            artifacts/performance.json
            artifacts/*.binlog
